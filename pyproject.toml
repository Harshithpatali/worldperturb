[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "worldperturb"
version = "0.1.0"
description = "Constraint-aware scenario engineering and reproducible what-if experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Harshith Devaraja" }]
keywords = ["simulation", "scenario-analysis", "sensitivity-analysis", "experimentation"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Scientific/Engineering"]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Harshithpatali/worldperturb"
Repository = "https://github.com/Harshithpatali/worldperturb"
Issues = "https://github.com/Harshithpatali/worldperturb/issues"

[project.scripts]
worldperturb = "worldperturb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldperturb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
